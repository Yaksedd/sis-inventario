<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar Cliente - Sistema de Inventarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
        }

        .banner-azul {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .navbar-custom {
            background-color: #000066;
            padding: 10px 20px;
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white !important;
        }

        .form-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .campo {
            background-color: #e9ecef;
        }

    </style>

</head>

<body>

<div class="banner-azul">
    Sistema de Inventarios
</div>


<nav class="navbar navbar-expand-lg navbar-custom">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold"
           th:href="@{/clientes}">
            SisInventario
        </a>

        <div class="collapse navbar-collapse justify-content-end">

            <ul class="navbar-nav">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/clientes}">
                        Inicio
                    </a>

                </li>

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       data-bs-toggle="dropdown">

                        Cliente

                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/clientes/registrar}">
                                Registrar
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/clientes/consultar}">
                                Consultar todos
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/clientes/consultar-id}">
                                Consultar por ID
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item"
                               th:href="@{/clientes/eliminar}">
                                Eliminar
                            </a>
                        </li>

                    </ul>

                </li>

            </ul>

        </div>

    </div>

</nav>


<div class="container">

    <div class="form-container shadow-sm">

        <h3 class="fw-bold text-danger mb-4">
            Eliminar cliente
        </h3>


        <div th:if="${mensaje}"
             class="alert alert-danger">

            <span th:text="${mensaje}"></span>

        </div>


        <form th:action="@{/clientes/eliminar/confirmar}"
              method="post">


            <!-- ID -->

            <div class="mb-3">

                <label class="form-label">
                    Identificación:
                </label>

                <input type="number"
                       name="idCliente"
                       th:value="${cliente.idCliente}"
                       class="form-control campo"
                       readonly>

            </div>


            <!-- NOMBRE -->

            <div class="mb-3">

                <label class="form-label">
                    Nombres:
                </label>

                <input type="text"
                       th:value="${cliente.nombre}"
                       class="form-control campo"
                       readonly>

            </div>


            <!-- APELLIDO -->

            <div class="mb-3">

                <label class="form-label">
                    Apellidos:
                </label>

                <input type="text"
                       th:value="${cliente.apellido}"
                       class="form-control campo"
                       readonly>

            </div>


            <!-- TELÉFONO -->

            <div class="mb-3">

                <label class="form-label">
                    Teléfono:
                </label>

                <input type="text"
                       th:value="${cliente.telefono}"
                       class="form-control campo"
                       readonly>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email:
                </label>

                <input type="text"
                       th:value="${cliente.email}"
                       class="form-control campo"
                       readonly>

            </div>


            <!-- BOTONES -->

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-danger px-4 me-2"
                        onclick="return confirm('¿Está seguro de que desea eliminar este cliente?');">

                    Eliminar

                </button>


                <a th:href="@{/clientes/eliminar}"
                   class="btn btn-dark px-4">

                    Regresar

                </a>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
