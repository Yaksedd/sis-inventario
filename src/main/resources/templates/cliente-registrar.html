<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Registrar Cliente - Sistema de Inventarios</title>

        <!-- Bootstrap 5.3.3 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <style>
            body {
                background-color: #f8fafc;
                font-family: 'Segoe UI', sans-serif;
                margin: 0;
                padding: 0;
            }

            .banner-azul {
                background-color: #0d6efd;
                color: white;
                padding: 20px;
                text-align: center;
                font-size: 2rem;
                font-weight: bold;
            }

            .navbar-custom {
                background-color: #000066;
                padding: 10px 20px;
            }

            .navbar-custom .navbar-brand,
            .navbar-custom .nav-link {
                color: white !important;
            }

            .navbar-custom .nav-link:hover {
                color: #cfe2ff !important;
            }

            .navbar-custom .dropdown-menu {
                background-color: #000066;
                border: none;
            }

            .navbar-custom .dropdown-item {
                color: white !important;
            }

            .navbar-custom .dropdown-item:hover {
                background-color: #0d6efd;
                color: white !important;
            }

            .form-container {
                max-width: 900px;
                margin: 40px auto;
                background: white;
                padding: 35px;
                border-radius: 8px;
                border: 1px solid #e2e8f0;
            }

            .form-label {
                color: #555;
                font-size: 0.95rem;
                margin-bottom: 5px;
                font-weight: 500;
            }

            .form-control {
                border-radius: 4px;
                padding: 8px 12px;
                border: 1px solid #cbd5e1;
            }

            .form-control:focus {
                border-color: #0d6efd;
                box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
            }
        </style>
    </head>

    <body>

        <!-- ========================================= -->
        <!-- BANNER -->
        <!-- ========================================= -->

        <div class="banner-azul">
            Sistema de Inventarios
        </div>


        <!-- ========================================= -->
        <!-- BARRA DE NAVEGACIÓN -->
        <!-- ========================================= -->

        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

            <div class="container-fluid">

                <!-- Nombre de la aplicación -->
                <a class="navbar-brand fw-bold" th:href="@{/clientes}">SisInventario</a>


                <!-- Botón para dispositivos móviles -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-expanded="false"
                        aria-label="Mostrar navegación">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <!-- Opciones del menú -->
                <div class="collapse navbar-collapse justify-content-end"
                     id="navbarNav">

                    <ul class="navbar-nav">

                        <!-- INICIO -->
                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/clientes}">
                                Inicio
                            </a>
                        </li>


                        <!-- CLIENTE -->
                        <li class="nav-item dropdown">

                            <a class="nav-link dropdown-toggle"
                               href="#"
                               id="dropCliente"
                               role="button"
                               data-bs-toggle="dropdown"
                               aria-expanded="false">
                                Cliente
                            </a>

                            <ul class="dropdown-menu">

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/clientes/registrar}">
                                        Registrar
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/clientes/consultar}">
                                        Consultar todos
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/clientes/consultar-id}">
                                        Consultar por ID
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/clientes/eliminar}">
                                        Eliminar
                                    </a>
                                </li>

                            </ul>

                        </li>


                        <!-- PRODUCTOS -->
                        <li class="nav-item">

                            <a class="nav-link"
                               href="#">
                                Productos
                            </a>

                        </li>


                        <!-- PROVEEDOR -->
                        <li class="nav-item">

                            <a class="nav-link"
                               href="#">
                                Proveedor
                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>


        <!-- ========================================= -->
        <!-- FORMULARIO -->
        <!-- ========================================= -->

        <div class="container">

            <div class="form-container shadow-sm">

                <h3 class="fw-bold text-dark mb-4">
                    Registrar nuevo cliente
                </h3>
                <div th:if="${error}"
                     class="alert alert-danger"
                     role="alert">
                    <span th:text="${error}"></span>
                </div>

                <form th:action="@{/clientes/guardar}"
                      th:object="${cliente}"
                      method="post">


                    <!-- IDENTIFICACIÓN -->

                    <div class="mb-3">

                        <label class="form-label">
                            Identificación:
                        </label>

                        <input type="text"
                               th:field="*{idCliente}"
                               class="form-control"
                               placeholder="Ingrese la identificación">

                    </div>


                    <!-- NOMBRES -->

                    <div class="mb-3">

                        <label class="form-label">
                            Nombres:
                        </label>

                        <input type="text"
                               th:field="*{nombre}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                               placeholder="Ingrese los nombres">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}">
                        </div>

                    </div>


                    <!-- APELLIDOS -->

                    <div class="mb-3">

                        <label class="form-label">
                            Apellidos:
                        </label>

                        <input type="text"
                               th:field="*{apellido}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid' : ''"
                               placeholder="Ingrese los apellidos">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('apellido')}"
                             th:errors="*{apellido}">
                        </div>

                    </div>


                    <!-- TELÉFONO -->

                    <div class="mb-3">

                        <label class="form-label">
                            Teléfono:
                        </label>

                        <input type="text"
                               th:field="*{telefono}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                               placeholder="Ingrese el teléfono">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('telefono')}"
                             th:errors="*{telefono}">
                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email:
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="Ingrese el correo electrónico">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>


                    <!-- BOTONES -->

                    <div class="mt-4">

                        <button type="submit"
                                class="btn btn-primary px-4 me-2">
                            Registrar
                        </button>

                        <a th:href="@{/clientes}"
                           class="btn btn-dark px-4">
                            Regresar
                        </a>

                    </div>

                </form>

            </div>

        </div>


        <!-- Bootstrap 5.3.3 JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>

    </body>
</html>
