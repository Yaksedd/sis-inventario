<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar Cliente - Sistema de Inventarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
        }

        .banner-azul {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .navbar-custom {
            background-color: #000066;
            padding: 10px 20px;
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white !important;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

    </style>

</head>

<body>

    <!-- BANNER -->

    <div class="banner-azul">
        Sistema de Inventarios
    </div>


    <!-- MENU -->

    <nav class="navbar navbar-expand-lg navbar-custom">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold"
               th:href="@{/clientes}">
                SisInventario
            </a>


            <div class="collapse navbar-collapse justify-content-end">

                <ul class="navbar-nav">

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/clientes}">
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           data-bs-toggle="dropdown">

                            Cliente

                        </a>


                        <ul class="dropdown-menu">

                            <li>

                                <a class="dropdown-item"
                                   th:href="@{/clientes/registrar}">
                                    Registrar
                                </a>

                            </li>


                            <li>

                                <a class="dropdown-item"
                                   th:href="@{/clientes/consultar}">
                                    Consultar todos
                                </a>

                            </li>


                            <li>

                                <a class="dropdown-item"
                                   th:href="@{/clientes/consultar-id}">
                                    Consultar por ID
                                </a>

                            </li>


                            <li>

                                <a class="dropdown-item"
                                   th:href="@{/clientes/eliminar}">
                                    Eliminar
                                </a>

                            </li>

                        </ul>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link" href="#">
                            Productos
                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link" href="#">
                            Proveedor
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- FORMULARIO -->

    <div class="container">

        <div class="form-container shadow-sm">

            <h3 class="fw-bold text-danger mb-4">
                Eliminar cliente
            </h3>


            <p class="text-muted">
                Ingrese el ID del cliente que desea eliminar.
            </p>


            <form th:action="@{/clientes/eliminar/buscar}"
                  method="post">


                <div class="mb-4">

                    <label class="form-label">
                        Identificación:
                    </label>

                    <input type="number"
                           name="idCliente"
                           class="form-control"
                           placeholder="Ingrese el ID del cliente"
                           required>

                </div>


                <!-- MENSAJE SI NO EXISTE -->

                <div th:if="${mensaje}"
                     class="alert alert-danger">

                    <span th:text="${mensaje}"></span>

                </div>


                <!-- BOTONES -->

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-danger px-4 me-2">

                        Buscar cliente

                    </button>


                    <a th:href="@{/clientes}"
                       class="btn btn-dark px-4">

                        Regresar

                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- BOOTSTRAP -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
