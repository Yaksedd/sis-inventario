<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar Cliente - Sistema de Inventarios</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
        }

        .banner-azul {
            background-color: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .navbar-custom {
            background-color: #000066;
            padding: 10px 20px;
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white !important;
        }

        .navbar-custom .dropdown-menu {
            background-color: #000066;
            border: none;
        }

        .navbar-custom .dropdown-item {
            color: white !important;
        }

        .navbar-custom .dropdown-item:hover {
            background-color: #0d6efd;
        }

        .form-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .form-label {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 4px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>

<body>

    <!-- BANNER -->
    <div class="banner-azul">
        Sistema de Inventarios
    </div>


    <!-- MENÚ -->
    <nav class="navbar navbar-expand-lg navbar-custom">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold"
               th:href="@{/clientes}">
                SisInventario
            </a>

            <div class="collapse navbar-collapse justify-content-end"
                 id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/clientes}">
                            Inicio
                        </a>
                    </li>

                    <!-- CLIENTE -->
                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           id="dropCliente"
                           role="button"
                           data-bs-toggle="dropdown">

                            Cliente

                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/clientes/registrar}">
                                    Registrar
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/clientes/consultar}">
                                    Consultar todos
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/clientes/consultar-id}">
                                    Consultar por ID
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/clientes/eliminar}">
                                    Eliminar
                                </a>
                            </li>

                        </ul>

                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Proveedor
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO -->
    <div class="container">

        <div class="form-container shadow-sm">

            <h3 class="fw-bold text-dark mb-4">
                Consultar cliente por identificación
            </h3>


            <!-- ================================================= -->
            <!-- PRIMERA PARTE: FORMULARIO PARA BUSCAR POR ID -->
            <!-- ================================================= -->

            <form th:action="@{/clientes/consultar-id/buscar}"
                  method="get">

                <div class="mb-3">

                    <label class="form-label">
                        Identificación del cliente:
                    </label>

                    <input type="number"
                           name="id"
                           class="form-control"
                           placeholder="Ingrese la identificación"
                           required>

                </div>


                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-primary px-4">
                        Buscar
                    </button>

                    <a th:href="@{/clientes}"
                       class="btn btn-dark px-4">
                        Regresar
                    </a>

                </div>

            </form>


            <!-- ================================================= -->
            <!-- SEGUNDA PARTE: RESULTADO DE LA CONSULTA -->
            <!-- ================================================= -->

            <div th:if="${cliente != null}"
                 class="mt-5">

                <hr>

                <h4 class="fw-bold text-dark mb-4">
                    Información del cliente
                </h4>


                <!-- IDENTIFICACIÓN -->

                <div class="mb-3">

                    <label class="form-label">
                        Identificación:
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${cliente.idCliente}"
                           readonly>

                </div>


                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label">
                        Nombres:
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${cliente.nombre}"
                           readonly>

                </div>


                <!-- APELLIDO -->

                <div class="mb-3">

                    <label class="form-label">
                        Apellidos:
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${cliente.apellido}"
                           readonly>

                </div>


                <!-- TELÉFONO -->

                <div class="mb-3">

                    <label class="form-label">
                        Teléfono:
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${cliente.telefono}"
                           readonly>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">
                        Email:
                    </label>

                    <input type="text"
                           class="form-control"
                           th:value="${cliente.email}"
                           readonly>

                </div>


                <!-- BOTÓN ACTUALIZAR -->

                <div class="mt-4">

                    <a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}"
                       class="btn btn-warning px-4">

                        Actualizar

                    </a>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- MENSAJE SI NO SE ENCUENTRA EL CLIENTE -->
            <!-- ================================================= -->

            <div th:if="${mensaje != null}"
                 class="alert alert-warning mt-4">

                <span th:text="${mensaje}"></span>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
